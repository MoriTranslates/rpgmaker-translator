name: Release

# Push a tag like v1.2.3 to build the Windows bundle and publish a GitHub Release.
# Run manually (workflow_dispatch) to build the bundle as a workflow artifact
# without publishing anything (a dry run of the packaging).
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: "3.14"
  PYTHONUTF8: "1"

jobs:
  build:
    name: Test + build Windows bundle
    runs-on: windows-latest
    timeout-minutes: 45
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements-lock.txt

      - name: Install pinned dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-lock.txt

      - name: Read version / check tag
        id: version
        shell: bash
        run: |
          VERSION=$(python -c "from translator.version import __version__; print(__version__)")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            if [[ "$GITHUB_REF_NAME" != "v$VERSION" ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match translator/version.py (__version__ = $VERSION). Expected tag v$VERSION."
              exit 1
            fi
            if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
              echo "::error::CHANGELOG.md has no '## [$VERSION]' section."
              exit 1
            fi
          fi
          echo "Version $VERSION"

      - name: Lint + tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m ruff check --output-format=github .
          python -m pytest -q

      - name: Build bundle
        id: build
        shell: pwsh
        run: ./packaging/build_windows.ps1 -OutDir "${{ runner.temp }}/dist"

      - name: Smoke test (exe starts and stays up)
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $exe = Join-Path "${{ runner.temp }}/dist" "RPGMakerTranslator/RPGMakerTranslator.exe"
          $p = Start-Process -FilePath $exe -PassThru
          Start-Sleep -Seconds 15
          if ($p.HasExited) { throw "App exited early with code $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          # Startup exceptions are caught by main.py's excepthook and logged
          # instead of crashing, so also fail if an error log appeared.
          $logs = Get-ChildItem -Recurse -Filter "_error.log" (Join-Path "${{ runner.temp }}/dist" "RPGMakerTranslator")
          if ($logs) { $logs | ForEach-Object { Get-Content $_.FullName }; throw "Startup error logged" }

      - uses: actions/upload-artifact@v7
        with:
          name: windows-bundle
          path: |
            ${{ steps.build.outputs.zip }}
            ${{ steps.build.outputs.sha256 }}
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: windows-bundle
          path: dist

      - name: Extract release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          awk -v hdr="## [$VERSION]" '
            index($0, hdr) == 1 { found = 1; next }
            found && index($0, "## [") == 1 { exit }
            found { print }
          ' CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "::error::Empty CHANGELOG section for $VERSION"; exit 1
          fi
          {
            echo
            echo "---"
            echo "**Download** \`RPGMakerTranslator-$VERSION-win64.zip\`, extract it anywhere, and run \`RPGMakerTranslator.exe\`."
            echo "Windows SmartScreen may warn because the exe is not code-signed: click *More info* -> *Run anyway*."
            echo
            echo "SHA256: \`$(cut -d' ' -f1 dist/*.sha256)\`"
          } >> release_notes.md
          cat release_notes.md

      - uses: softprops/action-gh-release@v3
        with:
          name: v${{ needs.build.outputs.version }}
          body_path: release_notes.md
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            dist/*.zip
            dist/*.sha256
          fail_on_unmatched_files: true
