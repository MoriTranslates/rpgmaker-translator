# Project metadata + tool configuration.
#
# The app is distributed as a PyInstaller bundle (see packaging/) or run from
# source with `python main.py`; it is not published to PyPI.  Runtime
# dependencies live in requirements.txt (single source, read below).

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "rpgmaker-translator"
description = "Local/cloud LLM translation tool for RPG Maker and other Japanese game engines"
readme = "README.md"
license = "LicenseRef-PolyForm-Noncommercial-1.0.0"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "MoriTranslates" }]
requires-python = ">=3.12"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: Microsoft :: Windows",
    "Environment :: X11 Applications :: Qt",
    "Private :: Do Not Upload",
]
dynamic = ["version", "dependencies"]

[project.optional-dependencies]
# Keep in sync with requirements-dev.txt
dev = ["pytest>=9.1,<10", "pytest-timeout>=2.4,<3", "ruff==0.17.3", "pyinstaller>=6.18,<7"]

[project.urls]
Homepage = "https://github.com/MoriTranslates/rpgmaker-translator"
Issues = "https://github.com/MoriTranslates/rpgmaker-translator/issues"
Changelog = "https://github.com/MoriTranslates/rpgmaker-translator/blob/master/CHANGELOG.md"

[tool.setuptools.dynamic]
version = { attr = "translator.version.__version__" }
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["translator*"]

# ---------------------------------------------------------------- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
# --durations: the slowest tests stay visible in every run.
addopts = "-ra --durations=10"
xfail_strict = true
# Hard per-test limit (pytest-timeout).  The whole suite runs in well under a
# minute and no test needs more than ~2 s; a test that hangs (a real network
# wait, a stuck QThread) must fail fast instead of stalling the run.  Only the
# "thread" method works on Windows: on a hit it dumps every thread's stack
# and ends the whole pytest process (no summary), so treat a timeout as a
# hard failure and read the dump.
timeout = 10
timeout_method = "thread"

# ------------------------------------------------------------------ ruff ---
[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = ["_reference", "benchmark", "fix_mojibake.py", "tests/fixtures"]

[tool.ruff.lint]
# Lenient start: real-bug checks only (syntax errors + pyflakes).
select = ["E9", "F"]
# Pre-existing findings, not bugs - ignored so CI is green on day one.
# Remove one at a time as the code is cleaned up (`ruff check --fix` handles
# F401/F541/F811 automatically; F841 needs a human look).
ignore = [
    "F401",  # unused import (33)
    "F541",  # f-string without placeholders (15)
    "F811",  # redefinition of unused name (2, main_window.py local `Counter` imports)
    "F841",  # unused local variable (18)
]
